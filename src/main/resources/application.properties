spring.application.name=a3getafe
server.port=8081
spring.datasource.url=jdbc:postgresql://localhost:5432/a3getafe
spring.datasource.username=postgres
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
# Cuando una petición es rechazada, la respuesta de error de Spring Boot solo trae el estado
# (400) y la ruta. Con estas dos propiedades añade también un mensaje y la lista de errores
# de validación (qué campo falló y por qué), para que quien consume la API sepa qué corregir.
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
