<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Solicitud de Adopción</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5" style="max-width: 600px;">
    <div class="card shadow p-4">
        <h2 class="mb-3 text-center">Solicitud para <span th:text="${cat.name}">Gato</span></h2>

        <form th:action="@{/adopt}" th:object="${adoptionRequest}" method="post">
            <input type="hidden" th:field="*{cat.id}" />

            <div class="mb-3">
                <label for="applicantName" class="form-label">Tu Nombre completo:</label>
                <input type="text" id="applicantName" th:field="*{applicantName}" class="form-control" th:classappend="${#fields.hasErrors('applicantName')} ? 'is-invalid'" />
                <div class="invalid-feedback" th:errors="*{applicantName}">Error en el nombre</div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Correo Electrónico:</label>
                <input type="email" id="email" th:field="*{email}" class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" />
                <div class="invalid-feedback" th:errors="*{email}">Error en el email</div>
            </div>

            <div class="mb-3">
                <label for="message" class="form-label">Cuéntanos por qué quieres adoptarlo:</label>
                <textarea id="message" th:field="*{message}" class="form-control" rows="4"></textarea>
            </div>

            <button type="submit" class="btn btn-primary w-100">Enviar Solicitud</button>
            <a th:href="@{/cats/{id}(id=${cat.id})}" class="btn btn-outline-secondary w-100 mt-2">Cancelar</a>
        </form>
    </div>
</div>
</body>
</html>
